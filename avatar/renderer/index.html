<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Omnix Avatar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="drag-region"></div>
    <div id="avatar-container">
        <!-- Diagnostic avatar -->
        <div id="diagnostic-avatar" class="avatar">
            <div id="face">
                <div class="eyes">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>
                <div class="mouth" id="mouth"></div>
            </div>
            <div id="state-indicator">OFF</div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
